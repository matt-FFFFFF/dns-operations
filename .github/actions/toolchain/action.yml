name: toolchain
description: Install the tools this repository is built on, at the versions mise.toml pins.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        cache: true

    # The terraform wrapper the hashicorp action installs rewrites stdout;
    # mise installs the real binary, so `tee` into a plan artifact and the
    # -detailed-exitcode the drift job reads both behave.
    - shell: bash
      run: |
        terraform version
        opa version | head -2
        uv --version
